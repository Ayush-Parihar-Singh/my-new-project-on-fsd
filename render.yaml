services:
  - type: web
    name: lastplate
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:apply-sql && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lastplate-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lastplate-db
          property: connectionString
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_UPLOAD_MB
        value: "5"

databases:
  - name: lastplate-db
    databaseName: lastplate
    user: lastplate
    plan: free
